name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore the same keystore used on the phones
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Manca il secret ANDROID_DEBUG_KEYSTORE_BASE64."
            echo "Senza di esso GitHub firmerebbe l'APK con una chiave nuova e i telefoni rifiuterebbero l'aggiornamento."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Read version
        id: ver
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.ver.outputs.tag }}
          name: Amici per la Coda ${{ steps.ver.outputs.version }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
