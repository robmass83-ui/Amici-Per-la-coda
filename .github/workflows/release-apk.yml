# Stessa regola di .cursor/rules/run-on-device.mdc e tool/publish_test_release.ps1:
# un solo versionCode per pubspec, APK ABI, tag GitHub e (se presente) ADB.
# Non ricostruire un tag che ha già gli APK: sarebbe un secondo binario allo stesso codice
# e Android rifiuterebbe l'installazione in-app sopra il sideload ADB.
#
# versionCode successivo (solo workflow_dispatch, senza tag) =
#   max(pubspec, ultima GitHub Release) + 1
# Tag: non si ricostruisce mai. Lo script locale ha già caricato quegli APK
# (stesso SHA-256 di ADB). Ricostruire main produrrebbe un altro binario.
name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-apk
  cancel-in-progress: false

permissions:
  contents: write

env:
  # SHA-256 della chiave già sui telefoni (debug.keystore di sviluppo).
  # Se il secret non è quella chiave, la build deve fallire: non spedire un APK ininstallabile.
  EXPECTED_CERT_SHA256: 1aa1211e900e794873ea1632ed09f5ce116e20f87010d96a9ecbf699c9d68fe2

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if this tag already has APKs (same bits as ADB/script)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "Tag ${GITHUB_REF_NAME}: APK già pubblicati dallo script PC. Non ricostruisco."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

      - name: Restore the upload keystore
        if: steps.gate.outputs.build == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Manca il secret ANDROID_DEBUG_KEYSTORE_BASE64."
            exit 1
          fi
          KEYSTORE_FILE="$GITHUB_WORKSPACE/android/upload-keystore.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          SIZE=$(stat -c%s "$KEYSTORE_FILE")
          if [ "$SIZE" -lt 1000 ]; then
            echo "Keystore ripristinato troppo piccolo ($SIZE byte)."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        if: steps.gate.outputs.build == 'true'
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        if: steps.gate.outputs.build == 'true'
        run: flutter pub get

      - name: Resolve version (tag as-is, otherwise max+1)
        if: steps.gate.outputs.build == 'true'
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RAW=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          NAME="${RAW%%+*}"
          PUBSPEC_CODE="${RAW##*+}"
          if ! [[ "$PUBSPEC_CODE" =~ ^[0-9]+$ ]]; then
            PUBSPEC_CODE=0
          fi

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_RAW="${GITHUB_REF_NAME#v}"
            TAG_NAME="${TAG_RAW%%+*}"
            TAG_CODE="${TAG_RAW##*+}"
            if [[ "$TAG_RAW" == *+* ]] && [[ "$TAG_CODE" =~ ^[0-9]+$ ]]; then
              NAME="$TAG_NAME"
              CODE="$TAG_CODE"
              echo "tag ${GITHUB_REF_NAME} -> $NAME+$CODE (nessun incremento)"
              echo "name=$NAME" >> "$GITHUB_OUTPUT"
              echo "code=$CODE" >> "$GITHUB_OUTPUT"
              echo "version=$NAME+$CODE" >> "$GITHUB_OUTPUT"
              echo "tag=v$NAME+$CODE" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          PREV_CODE=0
          PREV_JSON=$(curl -sS -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" || true)
          PREV_TAG=$(printf '%s' "$PREV_JSON" | jq -r '.tag_name // empty')
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "null" ]; then
            PREV_RAW="${PREV_TAG#v}"
            PREV_CODE="${PREV_RAW##*+}"
            if ! [[ "$PREV_CODE" =~ ^[0-9]+$ ]]; then
              PREV_CODE=0
            fi
          fi
          MAX=$PUBSPEC_CODE
          if [ "$PREV_CODE" -gt "$MAX" ]; then
            MAX=$PREV_CODE
          fi
          CODE=$((MAX + 1))
          echo "pubspec=$RAW pubspec_code=$PUBSPEC_CODE prev_tag=$PREV_TAG prev_code=$PREV_CODE -> $NAME+$CODE"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "version=$NAME+$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME+$CODE" >> "$GITHUB_OUTPUT"

      - name: Build ABI APKs
        if: steps.gate.outputs.build == 'true'
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="${{ steps.ver.outputs.name }}" \
            --build-number="${{ steps.ver.outputs.code }}" \
            -Pforce-version-code-ignoring-abi=true

      - name: Verify signature, versionCode and size
        if: steps.gate.outputs.build == 'true'
        run: |
          set -euo pipefail
          EXPECTED="${EXPECTED_CERT_SHA256,,}"
          EXPECTED_CODE="${{ steps.ver.outputs.code }}"
          shopt -s nullglob
          APKS=(build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
                build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk)
          COUNT=0
          AAPT=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/aapt 2>/dev/null | tail -1)
          for APK in "${APKS[@]}"; do
            if [ ! -f "$APK" ]; then
              echo "Manca $APK"
              exit 1
            fi
            SIZE=$(stat -c%s "$APK")
            echo "APK $APK size=$SIZE"
            if [ "$SIZE" -gt 31457280 ]; then
              echo "APK sopra 30 MB: $SIZE"
              exit 1
            fi
            if [ -n "$AAPT" ]; then
              BADGING=$("$AAPT" dump badging "$APK")
              APK_CODE=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
              echo "versionCode=$APK_CODE (atteso $EXPECTED_CODE)"
              if [ "$APK_CODE" != "$EXPECTED_CODE" ]; then
                echo "versionCode APK $APK_CODE diverso da $EXPECTED_CODE"
                exit 1
              fi
            fi
            APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | tail -1)
            if [ -z "$APKSIGNER" ]; then
              echo "apksigner non trovato."
              exit 1
            fi
            RAW=$("$APKSIGNER" verify --print-certs "$APK")
            echo "$RAW"
            CERT=$(printf '%s\n' "$RAW" \
              | awk '/SHA-256 digest:/{print $NF; exit}' \
              | tr 'A-F' 'a-f' \
              | tr -d ':')
            echo "cert $CERT"
            if [ -z "$CERT" ]; then
              echo "Non riesco a leggere la firma dell'APK."
              exit 1
            fi
            if [ "$CERT" != "$EXPECTED" ]; then
              echo "Firma $CERT diversa da quella dei telefoni $EXPECTED"
              echo "Aggiorna il secret ANDROID_DEBUG_KEYSTORE_BASE64 con il debug.keystore di questo PC."
              exit 1
            fi
            COUNT=$((COUNT + 1))
          done
          if [ "$COUNT" -lt 2 ]; then
            echo "Servono gli APK arm64 e armeabi-v7a"
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        if: steps.gate.outputs.build == 'true'
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Amici per la Coda ${{ steps.ver.outputs.version }}
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Stesso versionCode ${{ steps.ver.outputs.code }} su ogni ABI.
            L'app controlla GitHub Releases all'avvio; a parità di codice non chiede l'aggiornamento.
