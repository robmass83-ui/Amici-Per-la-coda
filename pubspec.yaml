name: amici_per_la_coda
description: Gestionale interno del rifugio cani Amici per la Coda ODV.
publish_to: 'none'
version: 1.0.5+46

environment:
  sdk: ^3.13.2

dependencies:
  archive: ">=3.6.1 <4.1.0"
  cloud_firestore: ^6.9.0
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0
  file_picker: ^10.3.10
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  image_picker: ^1.2.3
  intl: ^0.20.2
  mobile_scanner: ^7.1.4
  open_filex: ^4.7.0
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^10.0.0
  url_launcher: ^6.3.1
  package_info_plus: ^9.0.1
  connectivity_plus: ^7.3.1
  gal: ^2.3.2
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  fake_cloud_firestore: ^4.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/branding/logo_login.png
    - assets/branding/logo_header.png
    - assets/moduli/modulo-preaffido.pdf
    - assets/moduli/modulo-adozione.pdf
    - assets/moduli/modulo-affido.pdf
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Italic.ttf
    - assets/fonts/Roboto-Bold.ttf
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
