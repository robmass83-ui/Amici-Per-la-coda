name: amici_per_la_coda
description: Gestionale interno del rifugio cani Amici per la Coda ODV.
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: ^3.13.2

dependencies:
  cloud_firestore: ^6.9.0
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0
  file_picker: ^10.3.10
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  image_picker: ^1.2.3
  intl: ^0.20.2
  mobile_scanner: ^7.1.4
  open_filex: ^4.7.0
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  fake_cloud_firestore: ^4.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo_login.png
    - assets/branding/logo_header.png
    - assets/moduli/modulo-preaffido.pdf
    - assets/moduli/modulo-adozione.pdf
    - assets/moduli/modulo-affido.pdf
